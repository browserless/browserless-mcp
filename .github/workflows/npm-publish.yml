name: Publish to npm

# Fires on the vX.Y.Z tag that release-please creates when its Release PR is
# merged. The same tag also triggers build-docker-image.yml, so one merge ships
# the npm package and the Docker image together on the same version.
#
# Tests are NOT re-run here: they run via test.yml on the Release PR before it
# is merged. This job only builds and publishes the package.

on:
  push:
    tags:
      - 'v*.*.*'

# Serialize publishes per-tag — two rapid pushes to the same ref would otherwise
# race two `npm publish` jobs, with the loser failing 403 (already published).
# cancel-in-progress: false because cancelling a mid-flight publish would leave
# the npm registry inconsistent with the GitHub Release.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

jobs:
  publish:
    if: github.repository == 'browserless/browserless-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No git push/pull after checkout, so don't persist credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: npm install -g npm@11.17.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      # `npm publish` runs the prepack hook (build), which compiles TypeScript and
      # assembles the published artifacts. Provenance is attached automatically
      # via npm trusted publishing (OIDC, id-token: write).
      - name: Publish to npm
        run: npm publish --access public

      # The package is already published by this point; a Slack hiccup must not
      # mark the release as failed.
      - name: Notify Slack
        if: success()
        continue-on-error: true
        run: bash scripts/ci/notify-slack.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK }}

  # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io)
  # as io.browserless/mcp. The registry stores metadata only: it reads server.json
  # (versions bumped by release-please) and checks that the npm package's
  # `mcpName` matches, so this must run after the npm publish above.
  #
  # Auth is DNS-based: a TXT record on browserless.io holds the public key and the
  # MCP_REGISTRY_PRIVATE_KEY secret holds the Ed25519 private key (hex).
  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Until the DNS record and secret exist, skip with a warning rather than
      # failing every release.
      - name: Check registry key is configured
        id: key
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::warning::MCP_REGISTRY_PRIVATE_KEY is not set; skipping MCP Registry publish."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.key.outputs.configured == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # The registry validates against npm, which can lag a few seconds behind
      # `npm publish`.
      - name: Wait for npm package
        if: steps.key.outputs.configured == 'true'
        run: |
          VERSION="${TAG#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "@browserless.io/mcp@${VERSION}" mcpName 2>/dev/null)" = "io.browserless/mcp" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::@browserless.io/mcp@${VERSION} with mcpName not visible on npm after 5 minutes"
          exit 1

      - name: Publish to MCP Registry
        if: steps.key.outputs.configured == 'true'
        run: |
          ./mcp-publisher login dns --domain browserless.io --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
