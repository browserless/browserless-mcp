name: Publish to npm

# Fires on the vX.Y.Z tag that release-please creates when its Release PR is
# merged. The same tag also triggers build-docker-image.yml, so one merge ships
# the npm package and the Docker image together on the same version.
#
# The tag is an independent release boundary, so this job re-runs the semantic
# setup/runtime test suite before publishing.

on:
  push:
    tags:
      - 'v*.*.*'

# Serialize publishes per-tag — two rapid pushes to the same ref would otherwise
# race two `npm publish` jobs, with the loser failing 403 (already published).
# cancel-in-progress: false because cancelling a mid-flight publish would leave
# the npm registry inconsistent with the GitHub Release.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

jobs:
  publish:
    if: github.repository == 'browserless/browserless-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No git push/pull after checkout, so don't persist credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: npm install -g npm@11.17.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Re-run semantic setup and runtime tests
        run: npm test

      # `npm publish` runs the prepack hook (`check:setup`), which compiles
      # TypeScript, checks the committed setup export, and assembles the
      # published artifacts. Provenance is attached automatically
      # via npm trusted publishing (OIDC, id-token: write).
      - name: Publish to npm
        run: npm publish --access public

      # The Docker image publishes in a separate same-tag workflow, so report
      # npm failures as well as success. A Slack hiccup must not alter release
      # status.
      - name: Notify Slack of npm publish result
        if: always()
        continue-on-error: true
        run: bash scripts/ci/notify-slack.sh
        env:
          PUBLISH_STATUS: ${{ job.status }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
