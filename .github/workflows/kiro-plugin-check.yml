name: Kiro plugin checks

on:
  pull_request:
    paths:
      - 'kiro/**'
      - 'scripts/ci/verify-kiro-plugin*.mjs'
      - '.github/workflows/kiro-plugin-check.yml'
      - 'release-please-config.json'
      - 'package.json'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/verify-kiro-plugin.mjs
      - run: node --test scripts/ci/verify-kiro-plugin.test.mjs
