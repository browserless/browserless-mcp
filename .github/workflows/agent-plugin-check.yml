name: Agent plugin checks

on:
  pull_request:
    paths:
      - 'copilot/**'
      - 'kiro/**'
      - '.github/plugin/**'
      - 'scripts/ci/verify-agent-plugins*.mjs'
      - '.github/workflows/agent-plugin-check.yml'
      - 'release-please-config.json'
      - 'package.json'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/ci/verify-agent-plugins.mjs
      - run: node --test scripts/ci/verify-agent-plugins.test.mjs
